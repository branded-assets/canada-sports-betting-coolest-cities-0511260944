&lt;div class=&quot;rg-spotlight&quot;&gt;&lt;div class=&quot;rg-cityface&quot;&gt;&lt;div class=&quot;rg-spot-eyebrow&quot; id=&quot;rg-spot-rank&quot;&gt;#1 in big cities · #1 overall&lt;/div&gt;&lt;h3 id=&quot;rg-spot-city&quot;&gt;New York City&lt;/h3&gt;&lt;p class=&quot;rg-location&quot; id=&quot;rg-spot-region&quot;&gt;New York, United States&lt;/p&gt;&lt;div class=&quot;rg-scorebig rg-counter&quot; id=&quot;rg-spot-score&quot; data-value=&quot;89.113&quot; data-decimals=&quot;2&quot;&gt;89.11&lt;/div&gt;&lt;div class=&quot;rg-scorebig-label&quot;&gt;Coolest Cities Score / 100&lt;/div&gt;&lt;div class=&quot;rg-component&quot;&gt;&lt;span&gt;Availability&lt;/span&gt;&lt;div class=&quot;rg-track&quot;&gt;&lt;i class=&quot;rg-fill&quot; id=&quot;rg-avail-fill&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;b class=&quot;rg-counter&quot; id=&quot;rg-spot-availability&quot; data-value=&quot;98.015&quot; data-decimals=&quot;2&quot;&gt;98.02&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;rg-component&quot;&gt;&lt;span&gt;Concentration&lt;/span&gt;&lt;div class=&quot;rg-track&quot;&gt;&lt;i class=&quot;rg-fill&quot; id=&quot;rg-conc-fill&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;b class=&quot;rg-counter&quot; id=&quot;rg-spot-concentration&quot; data-value=&quot;62.408&quot; data-decimals=&quot;2&quot;&gt;62.41&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;rg-score-defs&quot; aria-label=&quot;Score component definitions&quot;&gt;&lt;p&gt;&lt;strong&gt;Availability (75%):&lt;/strong&gt; Number of events and amenities across six categories.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Concentration (25%):&lt;/strong&gt; Those same events and amenities per square mile.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rg-skyline&quot;&gt;&lt;h3&gt;Six signals of city life&lt;/h3&gt;&lt;p&gt;Each column shows the city&#x27;s raw count as a share of the highest count for that indicator among all 150 cities. These are visual comparisons, not score weights.&lt;/p&gt;&lt;svg viewBox=&quot;0 0 600 240&quot; class=&quot;rg-signature&quot; role=&quot;img&quot; aria-label=&quot;Six city indicators compared to the highest city count in each category&quot;&gt;&lt;line x1=&quot;21&quot; y1=&quot;183&quot; x2=&quot;580&quot; y2=&quot;183&quot; stroke=&quot;#D5BCC2&quot; stroke-width=&quot;2&quot;/&gt;&lt;g id=&quot;rg-signature-graphic&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;div class=&quot;rg-sixmetrics&quot; id=&quot;rg-sixmetrics&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;rg-featurefoot&quot;&gt;&lt;span&gt;&lt;b&gt;One scoring benchmark&lt;/b&gt; across big, medium and small cities.&lt;/span&gt;&lt;span&gt;Snapshot: November 1, 2026 · Event window through January 31, 2027&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;rg-action&quot; id=&quot;rg-feature-png&quot;&gt;Download city graphic PNG&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;rg-section rg-alt&quot; id=&quot;rg-findings&quot;&gt;&lt;div class=&quot;rg-wrap&quot;&gt;&lt;p class=&quot;rg-overline&quot;&gt;What the numbers show&lt;/p&gt;&lt;h2&gt;Key findings&lt;/h2&gt;&lt;p class=&quot;rg-sub&quot;&gt;Five findings from the November 2026 study of 150 cities.&lt;/p&gt;
&lt;article class=&quot;rg-finding&quot;&gt;&lt;div class=&quot;rg-index&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;rg-overline&quot;&gt;Big-city leader&lt;/p&gt;&lt;h3&gt;New York City tops the big-city leaderboard&lt;/h3&gt;&lt;p class=&quot;rg-summary&quot;&gt;New York City scores 89.11, placing it 9.24 points ahead of Boston in the big-city rankings. Its availability score of 98.02 is the highest in the study, reflecting its extensive event and amenity listings.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rg-figure&quot;&gt;&lt;span class=&quot;rg-counter&quot; data-value=&quot;89.113&quot; data-decimals=&quot;2&quot;&gt;89.11&lt;/span&gt;&lt;span class=&quot;rg-figlabel&quot;&gt;New York City · big-city score&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;rg-finding&quot;&gt;&lt;div class=&quot;rg-index&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;rg-overline&quot;&gt;Medium-city leader&lt;/p&gt;&lt;h3&gt;Minneapolis takes the top spot among medium cities&lt;/h3&gt;&lt;p class=&quot;rg-summary&quot;&gt;Minneapolis leads the 62 medium cities with a score of 69.37, placing it 2.11 points ahead of runner-up Pittsburgh. Its measured amenities include 209 coffee shops and 37 breweries.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rg-figure&quot;&gt;&lt;span class=&quot;rg-counter&quot; data-value=&quot;69.370&quot; data-decimals=&quot;2&quot;&gt;69.37&lt;/span&gt;&lt;span class=&quot;rg-figlabel&quot;&gt;Minneapolis · medium-city score&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;rg-finding&quot;&gt;&lt;div class=&quot;rg-index&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;rg-overline&quot;&gt;Small-city leader&lt;/p&gt;&lt;h3&gt;Richmond, Virginia, claims the small-city crown&lt;/h3&gt;&lt;p class=&quot;rg-summary&quot;&gt;Richmond, Virginia, leads the 38 small cities with a score of 55.40, beating second-place Boise by 4.09 points. Among its measured amenities are 22 breweries, 18 museums and 147 parks.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rg-figure&quot;&gt;&lt;span class=&quot;rg-counter&quot; data-value=&quot;55.399&quot; data-decimals=&quot;2&quot;&gt;55.40&lt;/span&gt;&lt;span class=&quot;rg-figlabel&quot;&gt;Richmond, VA · small-city score&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;rg-finding&quot;&gt;&lt;div class=&quot;rg-index&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;rg-overline&quot;&gt;Concentration leader&lt;/p&gt;&lt;h3&gt;Boston leads on concentration of city amenities&lt;/h3&gt;&lt;p class=&quot;rg-summary&quot;&gt;Boston earns a concentration score of 82.78, the highest in the study, just ahead of San Francisco at 82.60. The final index weights availability at 75% and geographic concentration at 25%.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rg-figure&quot;&gt;&lt;span class=&quot;rg-counter&quot; data-value=&quot;82.777&quot; data-decimals=&quot;2&quot;&gt;82.78&lt;/span&gt;&lt;span class=&quot;rg-figlabel&quot;&gt;Boston · concentration score&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;rg-finding&quot;&gt;&lt;div class=&quot;rg-index&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;rg-overline&quot;&gt;Canadian city leader&lt;/p&gt;&lt;h3&gt;Toronto leads the Canadian cities studied&lt;/h3&gt;&lt;p class=&quot;rg-summary&quot;&gt;Toronto scores 75.30, the highest among the 50 Canadian cities included. Montreal follows at 69.59, a 5.71-point gap, with Vancouver next at 68.88.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rg-figure&quot;&gt;&lt;span class=&quot;rg-counter&quot; data-value=&quot;75.298&quot; data-decimals=&quot;2&quot;&gt;75.30&lt;/span&gt;&lt;span class=&quot;rg-figlabel&quot;&gt;Toronto · Canadian city score&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;

&lt;section class=&quot;rg-section&quot; id=&quot;rg-rankings&quot;&gt;&lt;div class=&quot;rg-wrap&quot;&gt;&lt;p class=&quot;rg-overline&quot;&gt;Three city-size leaderboards&lt;/p&gt;&lt;h2&gt;Top coolest cities by size&lt;/h2&gt;&lt;p class=&quot;rg-sub&quot;&gt;Switch among big, medium and small cities. Choose a measure to rank the cities in each size group. The bar and table views show the highest-ranking cities for that measure, with full scoring details available in the table.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;rg-ranknote&quot;&gt;Selecting a measure reranks every city in the chosen size group and shows its first 15 entries. Equal values share a rank; the composite Coolest Cities Score breaks ties for display order. Index scores use the same benchmark across all 150 cities. Raw event and amenity counts are not adjusted for city size.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rg-editorial&quot; aria-labelledby=&quot;rg-editorial-heading&quot;&gt;
&lt;h3 id=&quot;rg-editorial-heading&quot;&gt;What stands out beyond the top spots&lt;/h3&gt;
&lt;p class=&quot;rg-editorial-intro&quot;&gt;These separate examples compare the original composite-index leaders within each size category. They do not change when a different ranking measure is selected above.&lt;/p&gt;
&lt;article class=&quot;rg-editorial-story&quot;&gt;&lt;h4&gt;Big cities: Washington, DC and Denver have their own claims&lt;/h4&gt;&lt;p&gt;New York City leads the big-city index, but other large markets stand out on individual measures. &lt;strong&gt;Washington, DC has 256 qualifying sporting events&lt;/strong&gt;, more than any other city in the score-leading big-city group, while &lt;strong&gt;Denver has 74 breweries&lt;/strong&gt;, the most in that same score-leading group. The figures offer two distinct ways to look beyond the composite score.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;rg-editorial-story&quot;&gt;&lt;h4&gt;Medium cities: New Orleans and Madison shine on different measures&lt;/h4&gt;&lt;p&gt;Minneapolis takes the medium-city crown, but &lt;strong&gt;New Orleans leads the score-leading medium-city group with 284 music events and 40 museums&lt;/strong&gt;. &lt;strong&gt;Madison records 354 parks&lt;/strong&gt;, the highest park count among those score-leading medium cities. Together, the figures illustrate how cultural activity and outdoor amenities can produce very different city stories.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;rg-editorial-story&quot;&gt;&lt;h4&gt;Small cities: Boise and Regina show there is more than one way to stand out&lt;/h4&gt;&lt;p&gt;Richmond, Virginia, ranks first among small cities, yet runner-up &lt;strong&gt;Boise lists 104 music events and 66 sporting events&lt;/strong&gt;, compared with Richmond’s 74 and 56. &lt;strong&gt;Regina has 362 parks&lt;/strong&gt;, the most among the score-leading small cities. Leading a single measure is not the same as topping the category’s combined score.&lt;/p&gt;&lt;/article&gt;

&lt;section class=&quot;rg-section&quot; id=&quot;rg-method&quot;&gt;&lt;div class=&quot;rg-wrap&quot;&gt;&lt;p class=&quot;rg-overline&quot;&gt;Definitions, coverage and source limits&lt;/p&gt;&lt;h2&gt;Methodology&lt;/h2&gt;&lt;p class=&quot;rg-sub&quot;&gt;The index ranks 150 selected cities using a common six-indicator scoring model. These are comparable index results, not a census of all North American cities.&lt;/p&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Study coverage and city groups&lt;/h3&gt;&lt;p&gt;100 US cities and 50 Canadian cities were selected for this study. The dataset divides them into 50 large, 62 midsize and 38 small cities. The preassigned size classifications were retained; no population cutoff was specified in the provided methodology. All three groups use a single scoring benchmark.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Event snapshot and shared three-month window&lt;/h3&gt;&lt;p&gt;Music and sporting-event listings were captured on November 1, 2026, for events scheduled November 1, 2026 through January 31, 2027, inclusive. Using the same near-term period in every city helps reduce differences caused by how far ahead organizers announce events, especially at smaller venues. It does not count every event that will ultimately occur.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Qualifying event listings&lt;/h3&gt;&lt;p&gt;Music and sports event counts came from Ticketmaster and SeatGeek listings for the study period. Qualifying performances and competitions were counted once where identifiable, excluding duplicate listings and ticket products that were not separate events. The figures reflect listings available at the time of the snapshot, not every event that may take place.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;City boundaries&lt;/h3&gt;&lt;p&gt;Event locations were assigned using venue city information from the ticketing sources. Listings do not always follow exact municipal boundaries, so city-level comparisons may contain some geographic uncertainty.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Local amenities and geographic concentration&lt;/h3&gt;&lt;p&gt;Coffee shops, breweries, museums and parks were measured using OpenStreetMap. Geographic concentration measures counts per square mile of land area. Halifax is measured using the Halifax Regional Municipality; map coverage and city boundaries can affect comparisons.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Exact scoring structure&lt;/h3&gt;&lt;p&gt;Six weighted indicators make up the index: music events (4), sports events (3), coffee shops (4), breweries (2), museums (3) and parks (3), for 19 total weight units. Each indicator&#x27;s availability component uses ln(1 + raw count), normalized to the maximum across the 150-city sample; the corresponding concentration component uses ln(1 + count per square mile), likewise normalized to the sample maximum. The six weighted values form an availability score and a concentration score. Final index = 75% availability + 25% concentration, on a 0–100 scale. Ranking uses the same normalization across every size group; displayed scores are rounded to two decimal places; rankings retain the original underlying precision.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Interpretation and geographic comparability&lt;/h3&gt;&lt;p&gt;The rankings capture the selected cities and sources at one point in time, not all places or every local event. The Canadian event listings captured for the study came from Ticketmaster only, while US coverage also included SeatGeek. Differences between countries therefore reflect unequal platform coverage as well as any underlying activity; they should not be interpreted as pure city-life differences. The indicators measure availability and density, not event quality, attendance, satisfaction or causation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;rg-methodrow&quot;&gt;&lt;h3&gt;Sources&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Ticketmaster&lt;/li&gt;&lt;li&gt;SeatGeek&lt;/li&gt;&lt;li&gt;OpenStreetMap&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
